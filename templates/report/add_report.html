{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Report</title>
    <link rel="stylesheet" href="{% static 'css/add_report.css' %}"> <!-- Link to external CSS -->
    {% include 'main_linkings.html' %}
</head>
<body>
    {% include 'header.html' %}
<div class="add-report-container">
    <h1 class="add-report-title">Add Report</h1>
    <form class="add-report-form" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }}
        </div>
        <button class="add-report-button" type="submit">Add Report</button>
    </form>
    <a class="add-report-cancel" href="{% url 'reports_staff_view' %}">Cancel</a>
</div>
{% include 'footer.html' %}
</body>
</html>
